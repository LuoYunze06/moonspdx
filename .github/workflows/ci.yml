name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: moon update
      - name: Format and strict checks
        run: |
          moon fmt --check
          moon check --target wasm-gc --deny-warn
          moon check --target wasm --deny-warn
          moon check --target js --deny-warn
      - name: Portable tests
        run: |
          moon test --target wasm-gc
          moon test --target wasm
          moon test --target js
      - name: Verify recorded maintenance workloads
        run: |
          moon build cmd/main --target js --release
          python3 scripts/verify_benchmarks.py --cli _build/js/release/build/cmd/main/main.js
      - name: Exercise JavaScript CLI
        shell: bash
        run: |
          moon run cmd/main --target js -- demo | tee demo.txt
          diff -u examples/demo.expected.txt demo.txt
          moon run cmd/main --target js -- inspect --expression 'MIT OR Apache-2.0 AND BSD-3-Clause' | tee inspect.txt
          diff -u examples/inspect.expected.txt inspect.txt
          moon run cmd/main --target js -- verify --claims "$(cat examples/claims.txt)" | tee suite.txt
          diff -u examples/suite.expected.txt suite.txt
          set +e
          moon run cmd/main --target js -- equivalent --left 'MIT OR Apache-2.0' --right 'MIT AND Apache-2.0' > counterexample.txt
          status=$?
          set -e
          test "$status" = "1"
          diff -u examples/counterexample.expected.txt counterexample.txt

  native:
    name: Native checks and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: moon update
      - name: Native verification
        run: |
          moon check --target native --deny-warn
          moon test --target native
          moon build cmd/main --target native --release
          moon run cmd/main --target native -- demo | tee demo-native.txt
          diff -u examples/demo.expected.txt demo-native.txt
          moon run cmd/main --target native -- verify --claims "$(cat examples/claims.txt)" | tee suite-native.txt
          diff -u examples/suite.expected.txt suite-native.txt
